# Every night: pulls the boards the Solver shared from the collector (worker/), adds them to the dashboard's digest
# (data/live/digest) and sends the dashboard its numbers, runs the tests, commits and pushes, then empties the
# collector's uploads up to what it pulled (its database would otherwise fill up in a few days). Named icons and
# unknown cards aren't collected or learned since 2026-10-30: the reader knows them all, and what came was other
# languages and misreads. It ran on the PC (scripts/nightly.sh) until 2026-10-29, when the smarter
# player's training and the daily check stopped; the repo is public, so its Actions minutes are free.
# Started by the collector's cron trigger (worker/src/schedule.ts), once a day: GitHub's own schedule ran hours late
# and made a second commit, so there's none here. Or on demand: gh workflow run live-data.yml
# Needs the repo variable LIVE_DATA_URL and the secrets LIVE_DATA_TOKEN (the collector's EXPORT_TOKEN) and
# DIGEST_SALT (the key the digest's install numbers are hashed with: scripts/live/collect.ts installKey), as
# dashboard.yml does. The raw boards aren't kept: the digest holds what the dashboard needs of them.
name: Live data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  live:
    if: ${{ vars.LIVE_DATA_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Pull the boards shared since the last run
        env:
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/pull.ts | tee pull.txt

      - name: Add the boards to the digest
        env:
          DIGEST_SALT: ${{ secrets.DIGEST_SALT }}
        run: npx vite-node scripts/live/digest.ts | tee digest.txt

      - name: Send the dashboard its numbers
        continue-on-error: true
        env:
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
          DIGEST_SALT: ${{ secrets.DIGEST_SALT }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: npx vite-node scripts/live/summary.ts

      # no secrets in the tests' environment
      - run: npm test

      - name: Commit and push
        id: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          { echo "Live data: $(head -1 pull.txt)"; echo; cat digest.txt; } > message.txt
          git commit -q -F message.txt
          # on top of anything pushed meanwhile
          git pull -q --rebase && git push -q
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # once what was pulled is in git (its place in the export too: data/live/state.json), the collector's uploads up to it go
      - name: Empty the collector's uploads up to what was pulled
        if: steps.push.outputs.pushed == '1'
        env:
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: |
          upto=$(python3 -c "import json; print(json.load(open('data/live/state.json')).get('last', 0))")
          [ "$upto" -gt 1000000000 ] && curl -sf -X POST -H "authorization: Bearer $LIVE_DATA_TOKEN" "$LIVE_DATA_URL/v1/export/rotate?upto=$upto"

