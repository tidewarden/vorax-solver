# Every 2 hours: pulls the boards shared since the last nightly commit (live-data.yml) from the live-data collector (worker/) and
# sends the collector's dashboard its numbers, worked out from the digest of every board before (data/live/digest)
# and the new ones (scripts/live/summary.ts). Nothing is
# committed: the nightly live data does that (live-data.yml). Started by the
# collector's cron trigger (worker/src/schedule.ts), with the schedule here as a backup. Or on demand:
# gh workflow run dashboard.yml
# Needs the repo variable LIVE_DATA_URL and the secrets LIVE_DATA_TOKEN (see worker/README.md) and DIGEST_SALT (the
# key the digest's install numbers are hashed with, as live-data.yml); until the
# variable is set, the job is skipped. The dashboard's usage panel (scripts/live/usage.ts) also needs the secrets
# CF_ANALYTICS_TOKEN (a Cloudflare token with only Account Analytics: Read) with CLOUDFLARE_ACCOUNT_ID, and
# GH_BILLING_TOKEN (a fine-grained GitHub token with only the account permission Plan: read); without them it's
# left out.
name: Dashboard numbers

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  summary:
    if: ${{ vars.LIVE_DATA_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Pull the boards shared since the last nightly commit
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/pull.ts

      - name: Send the dashboard its numbers
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
          DIGEST_SALT: ${{ secrets.DIGEST_SALT }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: npx vite-node scripts/live/summary.ts
