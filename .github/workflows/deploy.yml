# Builds the site and publishes it to Cloudflare Pages (https://voraxlab.pages.dev/tli-vorax-simulator/), on a push
# to main that changes the site (the nightly jobs' data commits don't), or on demand: gh workflow run deploy.yml
# The old address, https://tidewarden.github.io/tli-vorax-simulator/, is the public repo's GitHub Pages site: the
# last build it published before the code went private, left as it was. Browsers there are sent on to the new address
# (src/ui/siteMove.ts); Vorax Overlay before 0.1.10 runs the Solver there until it updates itself.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', 'scripts/**', 'worker/**', 'desktop/**', 'training/**', '.github/workflows/issue-fixer.yml', '.github/workflows/desktop.yml', '.github/workflows/dashboard.yml', '.github/workflows/live-data.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # the token can't list accounts, so wrangler is told which one
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p pages-site && cp -r dist pages-site/tli-vorax-simulator
          printf '/ /tli-vorax-simulator/ 302\n/tli-vorax-simulator /tli-vorax-simulator/ 301\n' > pages-site/_redirects
          # from a folder of its own: run beside the project, wrangler sets the project up as a Worker instead
          cd pages-site && npx --yes wrangler@4.152.0 pages deploy . --project-name voraxlab --branch main --commit-dirty=true
